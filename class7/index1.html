<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes fadeIn{
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
        }
        h1{
            animation: fadeIn 5s;
        }
        .ball{
            width: 80px;
            height: 80px;
            background-color: rgb(93, 188, 247);
            border-radius: 50%;
            animation: bounce 1s infinite;
        }
        @keyframes bounce{
            0%{
                transform: translateY(0);
            }
            50%{
                transform: translateX(100px);
            }
            100%{
                transform: translateY(0);
            }
        }
        .box{
            width: 120px;
            height: 120px;
            background: royalblue;
            animation: spin 2s infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        button{
            padding: 15px;
            background-color: black;
            color: white;
            border: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.2);
            }
            100%{
                transform: scale(1);
            }
        }
        h2{
            animation: fadeInUp 2s ease 1s infinite;
        }
        @keyframes fadeInUp{
            from{
                opacity: 0;
                transform: translateY(50px);
            }
            to{
                opacity: 1;
                transform: translateY();
            }
        }
    </style>
</head>
<body>
    <h1>Son Goku</h1>
    <div class="ball"></div><br>
    <div class="box"></div><br><br>
    <button>Subscribe</button><br><br>
    <h2>Animation</h2>
</body>
</html>
