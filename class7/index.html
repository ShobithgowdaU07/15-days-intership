<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: darkred;
            color: white;
            padding: 10px 10px;
            border: none;
            cursor: pointer;
            transition: all 2s ease;
        }
        button:hover{
            background: green;
            transform: scale(1.2);
            box-shadow: 0px 5px 20px black;
        }
    </style>
</head>
<body>
    <button>Hover Me</button>
</body>
</html>
